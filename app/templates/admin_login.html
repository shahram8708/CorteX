{% extends 'base.html' %}

{% block content %}

<style>
    .login-card {
        background-color: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease-in-out;
        animation: fadeSlide 0.8s ease;
    }

    .login-card:hover {
        transform: scale(1.02);
    }

    @keyframes fadeSlide {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .login-icon {
        font-size: 48px;
        color: #5e60ce;
        margin-bottom: 20px;
        animation: bounce 1.2s infinite;
    }

    @keyframes bounce {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-5px);
        }
    }

    .btn-custom {
        background-color: #5e60ce;
        border: none;
        font-weight: bold;
        transition: all 0.3s ease;
    }

    .btn-custom:hover {
        background-color: #4d4eaf;
        box-shadow: 0 4px 12px rgba(94, 96, 206, 0.4);
        transform: translateY(-2px);
    }

    .form-label {
        font-weight: 600;
        color: #333;
    }
</style>

<div class="container mt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="login-card text-center">
                <i class="fas fa-user-shield login-icon"></i>
                <h3 class="mb-4">Admin Login</h3>

                <form method="POST">
                    <div class="form-group mb-3 text-start">
                        <label class="form-label"><i class="fas fa-user me-2"></i>Username</label>
                        <input type="text" name="username" class="form-control rounded-pill p-2" required>
                    </div>

                    <div class="form-group mb-4 text-start">
                        <label class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                        <input type="password" name="password" class="form-control rounded-pill p-2" required>
                    </div>

                    <button type="submit" class="btn btn-custom w-100 rounded-pill py-2">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}
