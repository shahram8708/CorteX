{% extends 'base.html' %}

{% block content %}

<style>
    .profile-card {
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        padding: 30px;
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }


    .btn-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }


    .fade-in {
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    .profile-icon {
        margin-right: 10px;
    }
</style>


<div class="container mt-5 fade-in">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="profile-card shadow-sm rounded-3 p-4">
                <h3 class="text-center mb-4">
                    <i class="fas fa-user-circle profile-icon"></i>Your Profile
                </h3>


                <div class="mb-3">
                    <h5><strong><i class="fas fa-user profile-icon"></i>Name:</strong> {{ user.name }}</h5>
                </div>
                <div class="mb-3">
                    <p><strong><i class="fas fa-envelope profile-icon"></i>Email:</strong> {{ user.email }}</p>
                </div>
                <div class="mb-3">
                    <p><strong><i class="fas fa-phone-alt profile-icon"></i>Phone:</strong> {{ user.phone }}</p>
                </div>
                <div class="mb-3">
                    <p><strong><i class="fas fa-map-marker-alt profile-icon"></i>Address:</strong> {{ user.address }}
                    </p>
                </div>
                <div class="mb-3">
                    <p><strong><i class="fas fa-user-tag profile-icon"></i>User Type:</strong> {{
                        user.user_type|capitalize }}</p>
                </div>


                <div class="text-center">
                    <a href="{{ url_for('main.edit_profile') }}" class="btn btn-primary btn-hover w-100">
                        <i class="fas fa-edit"></i> Edit Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}
