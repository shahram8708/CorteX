{% extends 'base.html' %}
{% block content %}
<div class="container-fluid fade-in">
    <h2 class="mb-4"><i class="fa fa-motorcycle text-primary"></i> Delivery Dashboard</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card bg-warning text-white shadow-sm card-hover">
                <div class="card-body text-center">
                    <i class="fa fa-truck fa-2x mb-2"></i>
                    <h5>Total Deliveries</h5>
                    <h3>{{ total_deliveries }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white shadow-sm card-hover">
                <div class="card-body text-center">
                    <i class="fa fa-check-circle fa-2x mb-2"></i>
                    <h5>Deliveries Completed</h5>
                    <h3>{{ total_completed }}</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4 shadow-sm card-hover">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <span><i class="fa fa-chart-area text-primary"></i> Daily Delivery Activity</span>
            <span class="badge bg-secondary">Live Analytics</span>
        </div>
        <div class="card-body">
            <canvas id="deliveryChart" style="height:300px;"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('deliveryChart').getContext('2d');
    const deliveryChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ chart_labels | tojson }},
            datasets: [{
                label: 'Deliveries',
                data: {{ chart_data | tojson }},
                backgroundColor: 'rgba(255, 193, 7, 0.2)',
                borderColor: 'rgba(255, 193, 7, 1)',
                borderWidth: 3,
                tension: 0.4,
                fill: true,
                pointRadius: 5,
                pointHoverRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    backgroundColor: '#343a40',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                },
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });
</script>
{% endblock %}
